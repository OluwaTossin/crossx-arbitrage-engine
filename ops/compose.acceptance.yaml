# Standalone acceptance stack. Always supply a unique --project-name.
# No reference to existing projects, external networks, volumes or containers.
services:
  postgres:
    build:
      context: ..
      dockerfile: ops/Dockerfile.postgres
    environment:
      POSTGRES_USER: crossx
      POSTGRES_PASSWORD: crossx
      POSTGRES_DB: crossx
    ports: ["127.0.0.1:${ACCEPTANCE_DB_PORT:-15432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossx -d crossx"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: {context: ..}
    environment:
      CROSSX_DATABASE_URL: postgresql+asyncpg://crossx:crossx@postgres:5432/crossx
      CROSSX_FEES: '{"kraken":{"maker":null,"taker":null},"coinbase":{"maker":null,"taker":null}}'
      CROSSX_EXCHANGES: '${CROSSX_EXCHANGES:-["kraken","coinbase","binance","cryptocom"]}'
      CROSSX_DISK_GUARD_PATH: /pgdata
      CROSSX_DISK_HEADROOM_GIB: ${CROSSX_DISK_HEADROOM_GIB:-5}
      CROSSX_DISK_CRITICAL_GIB: ${CROSSX_DISK_CRITICAL_GIB:-3}
      CROSSX_CAPACITY_RUN_SECONDS: ${CROSSX_CAPACITY_RUN_SECONDS:-0}
      CROSSX_CAPACITY_DAILY_GB: ${CROSSX_CAPACITY_DAILY_GB:-23.22}
      CROSSX_PERSISTENCE_BATCH_SIZE: ${CROSSX_PERSISTENCE_BATCH_SIZE:-32}
      CROSSX_BOOK_SAMPLE_INTERVAL_SECONDS: ${CROSSX_BOOK_SAMPLE_INTERVAL_SECONDS:-0}
      CROSSX_SYMBOLS: '["BTC/USD","ETH/USD"]'
    volumes: ["postgres-data:/pgdata:ro"]
    ports: ["127.0.0.1:${ACCEPTANCE_APP_PORT:-18080}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 15s
  storage-metrics:
    build: {context: ..}
    stop_grace_period: 15s
    command: ["python", "-m", "crossx.storage"]
    environment:
      CROSSX_DATABASE_URL: postgresql+asyncpg://crossx:crossx@postgres:5432/crossx
      CROSSX_STORAGE_BUDGET_GIB: ${CROSSX_STORAGE_BUDGET_GIB:-30}
      CROSSX_DAILY_BOOK_BUDGET_GIB: ${CROSSX_DAILY_BOOK_BUDGET_GIB:-20}
    volumes: ["postgres-data:/pgdata:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  prometheus:
    build:
      context: ../monitoring
      dockerfile: Dockerfile.prometheus
    ports: ["127.0.0.1:${ACCEPTANCE_PROM_PORT:-19091}:9090"]
    volumes: ["prometheus-data:/prometheus"]
  grafana:
    build:
      context: ../monitoring
      dockerfile: Dockerfile.grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports: ["127.0.0.1:${ACCEPTANCE_GRAFANA_PORT:-13080}:3000"]
    volumes: ["grafana-data:/var/lib/grafana"]
volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
