services:
  postgres:
    build:
      context: .
      dockerfile: ops/Dockerfile.postgres
    environment:
      POSTGRES_USER: crossx
      POSTGRES_PASSWORD: crossx
      POSTGRES_DB: crossx
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossx -d crossx"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      CROSSX_DATABASE_URL: postgresql+asyncpg://crossx:crossx@postgres:5432/crossx
      CROSSX_FEES: '${CROSSX_FEES:-{}}'
      CROSSX_EXCHANGES: '${CROSSX_EXCHANGES:-["kraken","coinbase","binance","cryptocom"]}'
      CROSSX_DISK_GUARD_PATH: /pgdata
      CROSSX_DISK_HEADROOM_GIB: ${CROSSX_DISK_HEADROOM_GIB:-5}
      CROSSX_DISK_CRITICAL_GIB: ${CROSSX_DISK_CRITICAL_GIB:-3}
      CROSSX_CAPACITY_RUN_SECONDS: ${CROSSX_CAPACITY_RUN_SECONDS:-0}
      CROSSX_CAPACITY_DAILY_GB: ${CROSSX_CAPACITY_DAILY_GB:-23.22}
      CROSSX_PERSISTENCE_BATCH_SIZE: ${CROSSX_PERSISTENCE_BATCH_SIZE:-32}
      CROSSX_BOOK_SAMPLE_INTERVAL_SECONDS: ${CROSSX_BOOK_SAMPLE_INTERVAL_SECONDS:-0}
      CROSSX_SYMBOLS: '${CROSSX_SYMBOLS:-["BTC/USD","ETH/USD"]}'
      CROSSX_TRADE_QUANTITY_BTC: ${CROSSX_TRADE_QUANTITY_BTC:-0.001}
      CROSSX_TRADE_QUANTITY_ETH: ${CROSSX_TRADE_QUANTITY_ETH:-0.01}
      CROSSX_MAX_BOOK_AGE_SECONDS: ${CROSSX_MAX_BOOK_AGE_SECONDS:-5}
      CROSSX_MAX_BOOK_SKEW_SECONDS: ${CROSSX_MAX_BOOK_SKEW_SECONDS:-2}
      CROSSX_MIN_NET_PROFIT: ${CROSSX_MIN_NET_PROFIT:-0}
      CROSSX_PERSISTENCE_TIMEOUT_SECONDS: ${CROSSX_PERSISTENCE_TIMEOUT_SECONDS:-10}
      CROSSX_SHUTDOWN_TIMEOUT_SECONDS: ${CROSSX_SHUTDOWN_TIMEOUT_SECONDS:-5}
    volumes: ["postgres-data:/pgdata:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  storage-metrics:
    build: {context: .}
    command: ["python", "-m", "crossx.storage"]
    environment:
      CROSSX_DATABASE_URL: postgresql+asyncpg://crossx:crossx@postgres:5432/crossx
      CROSSX_STORAGE_BUDGET_GIB: ${CROSSX_STORAGE_BUDGET_GIB:-30}
      CROSSX_DAILY_BOOK_BUDGET_GIB: ${CROSSX_DAILY_BOOK_BUDGET_GIB:-20}
    volumes: ["postgres-data:/pgdata:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  prometheus:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.prometheus
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres-data:
