groups:
  - name: crossx-local
    rules:
      - alert: CrossXServiceNotReady
        expr: up{job="crossx"} == 0 or crossx_ready{job="crossx"} != 1 or absent(up{job="crossx"})
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: CrossX ingestion is not ready
          description: Inspect app and PostgreSQL logs; no live trading exists. Do not delete volumes.
      - alert: CrossXEventFeedStale
        expr: time() - crossx_last_event_timestamp_seconds{job="crossx"} > 5
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: Exchange observation clock is stale
          description: Check exchange synchronization, source age, reconstruction and queue timing panels.
      - alert: CrossXStaleEventsRejected
        expr: increase(crossx_detection_rejections_total{job="crossx",reason="stale_event"}[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: Stale events excluded from research signals
          description: Inspect event-at-receive versus queue residence; receive age alone misses buffering.
      - alert: CrossXQueuePressure
        expr: crossx_queue_depth{job="crossx"} >= 120
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: Bounded queue nearing capacity
          description: Compare ingress, commit, batch-size and residence panels. Do not raise capacity blindly.
      - alert: CrossXQueueResidenceHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(crossx_queue_residence_seconds_bucket{job="crossx"}[2m]))) > 1
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: Queue residence p95 exceeds one second
          description: Profile persistence throughput and CPU; stale books remain excluded.
      - alert: CrossXPersistenceFailure
        expr: increase(crossx_persistence_failures_total{job="crossx"}[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: Database write request failed
          description: Inspect PostgreSQL health, timeout and disk space; committed books may lack a later signal.
      - alert: CrossXStorageTelemetryUnavailable
        expr: up{job="crossx-storage"} == 0 or crossx_storage_up == 0 or time() - crossx_storage_last_success_timestamp_seconds > 60
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: Storage monitoring unavailable
          description: Check storage-metrics logs and read-only PostgreSQL volume mount.
      - alert: CrossXVolumeSpaceLow
        expr: crossx_storage_volume_free_bytes < 5 * 1024 * 1024 * 1024
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: PostgreSQL filesystem has under 5 GiB available
          description: Stop new collection if needed; preserve and export data before any human-approved cleanup.
      - alert: CrossXDatasetBudgetNear
        expr: crossx_storage_database_bytes > crossx_storage_budget_bytes * 0.8
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: Dataset exceeds 80 percent of configured budget
          description: Run the read-only retention plan; no automatic deletion or quota enforcement exists.
      - alert: CrossXDailyGrowthBudgetExceeded
        expr: deriv(crossx_storage_books_bytes[15m]) * 86400 > crossx_storage_daily_book_budget_bytes
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Projected daily book growth exceeds budget
          description: Review retention and explicit optional sampling; extrapolation is not a completed day.
      - alert: CrossXDatasetBudgetWithinDay
        expr: predict_linear(crossx_storage_database_bytes[15m], 86400) > crossx_storage_budget_bytes
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Current growth would exceed dataset budget within a day
          description: Inspect measured bytes and shared Docker filesystem capacity before prolonged collection.
      - alert: CrossXPaperUnhedged
        expr: crossx_paper_unhedged_quantity > 0
        labels: {severity: warning}
        annotations:
          summary: Paper session contains unhedged exposure
          description: Inspect simulated failed legs and inventory; no real orders exist.
      - alert: CrossXPaperDrawdown
        expr: crossx_paper_drawdown_fraction > 0.1
        labels: {severity: warning}
        annotations:
          summary: Paper drawdown exceeds ten percent
          description: Stop the research scenario and review configured loss limits and marks.
